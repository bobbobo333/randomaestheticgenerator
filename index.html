<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BL3CKPURPLE — Random Fashion Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header>
            <h1>BL3CKPURPLE</h1>
            <p>RANDOM FASHION GENERATOR</p>
        </header>


        <section class="generator">

            <!-- HAT -->
            <div class="section">

                <div class="section-heading">
                    <span>🧢</span>
                    <h2>Hat</h2>
                </div>

                <div id="hat" class="result">---</div>

                <button class="generate-button"
                        onclick="generateHat()"
                        id="hatButton">
                    GENERATE HAT
                </button>

            </div>


            <!-- UPPER BODY -->
            <div class="section">

                <div class="section-heading">
                    <span>👕</span>
                    <h2>Upper Body</h2>
                </div>

                <div id="layerCount" class="result">
                    ---
                </div>

                <button class="generate-button"
                        onclick="generateLayers()"
                        id="layerButton">
                    GENERATE LAYERS
                </button>

                <div id="layers" class="sub-results"></div>

            </div>


            <!-- BOTTOM -->
            <div class="section">

                <div class="section-heading">
                    <span>👖</span>
                    <h2>Bottom</h2>
                </div>

                <div id="bottom" class="result">---</div>

                <button class="generate-button"
                        onclick="generateBottom()"
                        id="bottomButton">
                    GENERATE BOTTOM
                </button>

            </div>


            <!-- SHOES -->
            <div class="section">

                <div class="section-heading">
                    <span>👟</span>
                    <h2>Shoes</h2>
                </div>

                <div id="shoes" class="result">---</div>

                <button class="generate-button"
                        onclick="generateShoes()"
                        id="shoesButton">
                    GENERATE SHOES
                </button>

            </div>


            <!-- ACCESSORIES -->
            <div class="section">

                <div class="section-heading">
                    <span>💍</span>
                    <h2>Accessories</h2>
                </div>

                <div id="accessoryCount" class="result">
                    ---
                </div>

                <button class="generate-button"
                        onclick="generateAccessories()"
                        id="accessoryButton">
                    GENERATE ACCESSORIES
                </button>

                <div id="accessories" class="sub-results"></div>

            </div>

        </section>


        <button class="reset-button"
                onclick="resetGenerator()">
            NEW OUTFIT
        </button>


        <footer>
            BL3CKPURPLE
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
