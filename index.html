<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BL3CKPURPLE Random Aesthetic Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>BL3CKPURPLE</h1>

        <p class="subtitle">RANDOM FASHION GENERATOR</p>

        <div class="generator">

            <div class="result-row">
                <div class="result-text">
                    <span class="emoji">🧢</span>
                    <strong>Hat</strong>
                    <span id="hat">---</span>
                </div>

                <button class="generate-button" onclick="generateCategory('hat')">
                    GENERATE HAT
                </button>
            </div>


            <div class="result-row">
                <div class="result-text">
                    <span class="emoji">👕</span>
                    <strong>Top</strong>
                    <span id="top">---</span>
                </div>

                <button class="generate-button" onclick="generateCategory('top')">
                    GENERATE TOP
                </button>
            </div>


            <div class="result-row">
                <div class="result-text">
                    <span class="emoji">👖</span>
                    <strong>Bottom</strong>
                    <span id="bottom">---</span>
                </div>

                <button class="generate-button" onclick="generateCategory('bottom')">
                    GENERATE BOTTOM
                </button>
            </div>


            <div class="result-row">
                <div class="result-text">
                    <span class="emoji">👟</span>
                    <strong>Shoes</strong>
                    <span id="shoes">---</span>
                </div>

                <button class="generate-button" onclick="generateCategory('shoes')">
                    GENERATE SHOES
                </button>
            </div>


            <div class="result-row">
                <div class="result-text">
                    <span class="emoji">💍</span>
                    <strong>Accessories</strong>
                    <span id="accessories">---</span>
                </div>

                <button class="generate-button" onclick="generateCategory('accessories')">
                    GENERATE ACCESSORIES
                </button>
            </div>

        </div>

        <p class="footer">Create something weird.</p>

    </main>

    <script src="script.js"></script>

</body>
</html>
